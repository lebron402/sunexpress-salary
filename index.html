<div>
<h1>SunExpress Salary Tracker</h1>
<p>Kabin Memuru Maaş Hesaplayıcı</p>
</div>
</div>

<div class="grid">
<div class="card">
<label>Base Salary (€)</label><input id="base" value="530">
<label>Duty Hours</label><input id="duty">
<label>Night Duty Hours</label><input id="night">
<label>Türkiye Yatı</label><input id="yati">
<label>BoB (€)</label><input id="bob">
<label>Off To Duty</label><input id="otd">
<label>Euro/TL</label><input id="rate" value="63.75">
<button onclick="calc()">HESAPLA</button>
</div>

<div class="card">
<div class="row"><span>Normal Saat</span><span id="n">0 €</span></div>
<div class="row"><span>100+ Saat</span><span id="o">0 €</span></div>
<div class="row"><span>Night Duty</span><span id="ni">0 €</span></div>
<div class="row"><span>Yatı</span><span id="y">0 €</span></div>
<div class="row"><span>Off To Duty</span><span id="ot">0 €</span></div>
<div class="row"><span>BoB</span><span id="b">0 €</span></div>
<hr>
<div class="row total"><span>Toplam €</span><span id="te">0 €</span></div>
<div class="row total"><span>Toplam ₺</span><span id="tt">0 ₺</span></div>
</div>
</div>
</div>

<script>
function calc(){
let base=parseFloat(document.getElementById('base').value)||0;
let duty=parseFloat(document.getElementById('duty').value)||0;
let night=parseFloat(document.getElementById('night').value)||0;
let yati=parseFloat(document.getElementById('yati').value)||0;
let bob=parseFloat(document.getElementById('bob').value)||0;
let otd=parseFloat(document.getElementById('otd').value)||0;
let rate=parseFloat(document.getElementById('rate').value)||63.75;

let normal=Math.max(Math.min(duty,100)-night,0)*2.75;
let overtime=Math.max(duty-100,0)*7.15;
let nightPay=night*17.82;
let yatiPay=yati*30;
let otdPay=otd*100;

let total=base+normal+overtime+nightPay+yatiPay+otdPay+bob;
let tl=total*rate;

n.textContent=normal.toFixed(2)+' €';
o.textContent=overtime.toFixed(2)+' €';
ni.textContent=nightPay.toFixed(2)+' €';
y.textContent=yatiPay.toFixed(2)+' €';
ot.textContent=otdPay.toFixed(2)+' €';
b.textContent=bob.toFixed(2)+' €';
te.textContent=total.toFixed(2)+' €';
tt.textContent=tl.toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺';
}
</script>
